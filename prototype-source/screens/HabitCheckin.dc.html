<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PlantCircle — Habit check-in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
:focus-visible{outline:3px solid #0A0A0A;outline-offset:2px;box-shadow:0 0 0 6px #FFFFFF}
a{color:#0A0A0A}a:hover{color:#000000}
.scrim{background:linear-gradient(180deg,rgba(0,0,0,0.35) 0%,rgba(0,0,0,0) 18%,rgba(0,0,0,0) 30%,rgba(0,0,0,0.9) 60%,rgba(0,0,0,0.94) 100%)}
.glass{background:rgba(255,255,255,0.22);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%)}
.bar{background:rgba(255,255,255,0.86);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; color: #0A0A0A; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased">
<div style="padding: 54px 24px 190px; display: flex; flex-direction: column; gap: 26px"><div style="display: flex"><a href="Home.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 999px; background: #F5F5F7; display: flex; align-items: center; justify-content: center; border: 0; cursor: pointer; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a></div><div style="display: flex; flex-direction: column; gap: 14px; "><span aria-hidden="true" style="width: 80px; height: 80px; border-radius: 999px; background: #EAF5EE; display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#155A37" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span><h1 style="margin: 0; font-size: 30px; font-weight: 700; line-height: 1.1; letter-spacing: -0.9px">Quick question — 3 months in</h1><p style="margin: 0; font-size: 17px; line-height: 1.5; color: #505054">Anonymous and optional. It shows whether cooking together changes habits.</p></div><p style="margin: 0; font-size: 19px; font-weight: 600; line-height: 1.35; letter-spacing: -0.3px">How many plant-based meals did you cook at home last week?</p><div role="radiogroup" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px"><sc-for list="{{opts}}" as="o" hint-placeholder-count="5"><button role="radio" aria-checked="{{o.sel}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for></div></div><div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(180deg, rgba(255,255,255,0) 0%, #FFFFFF 55%); pointer-events: none"></div><div class="bar" style="position: absolute; left: 14px; right: 14px; bottom: 22px; padding: 12px; border-radius: 24px; border: 1px solid rgba(0,0,0,0.06); box-shadow: 0 10px 30px rgba(0,0,0,0.14); display: flex; flex-direction: column; gap: 6px"><a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 20px; border: 0; border-radius: 16px; background: #0A0A0A; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 600; text-decoration: none; cursor: pointer">Send</a><a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; border: 0; background: transparent; color: #505054; font: inherit; font-size: 15px; font-weight: 500; text-decoration: none; cursor: pointer">Don’t ask me again</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { v: '3–5' };
  }
  renderVals() {
    const opts = ['0', '1–2', '3–5', '6–9', '10+'].map((label) => { const on = this.state.v === label; return { label, sel: on ? 'true' : 'false', pick: () => this.setState({ v: label }),
      style: 'min-height: 56px; border: 0; border-radius: 16px; font: inherit; font-size: 17px; cursor: pointer; ' + (on ? 'background: #0A0A0A; color: #FFFFFF; font-weight: 700' : 'background: #F5F5F7; color: #0A0A0A; font-weight: 500') }; });
    return { opts };
  }
}
</script>
</body>
</html>
