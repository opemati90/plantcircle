<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PlantCircle — Adopt a table</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
:focus-visible{outline:3px solid #0A0A0A;outline-offset:2px;box-shadow:0 0 0 6px #FFFFFF}
a{color:#0A0A0A}a:hover{color:#000000}
.scrim{background:linear-gradient(180deg,rgba(0,0,0,0.35) 0%,rgba(0,0,0,0) 18%,rgba(0,0,0,0) 30%,rgba(0,0,0,0.9) 60%,rgba(0,0,0,0.94) 100%)}
.glass{background:rgba(255,255,255,0.22);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%)}
.bar{background:rgba(255,255,255,0.86);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; color: #0A0A0A; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased">
<div style="height: 844px; box-sizing: border-box; padding: 56px 24px 40px; display: flex; flex-direction: column"><div style="display: flex"><a href="GlobalPlan.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: #F5F5F7; display: flex; align-items: center; justify-content: center; border: 0; cursor: pointer; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a></div><h1 style="margin: 36px 0 10px; font-size: 32px; font-weight: 700; line-height: 1.08; letter-spacing: -1px">Host a Jollof Weekend table</h1><p style="margin: 0; font-size: 16px; line-height: 1.5; color: #505054">Kemi’s recipe, shopping list and live intro come with it. You choose the rest.</p><p style="margin: 30px 0 12px; font-size: 17px; font-weight: 600">When?</p><div role="radiogroup" aria-label="Day" style="display: flex; gap: 8px"><sc-for list="{{days}}" as="d" hint-placeholder-count="2"><button role="radio" aria-checked="{{d.sel}}" onClick="{{d.pick}}" style="{{d.style}}">{{d.label}}</button></sc-for></div><div role="radiogroup" aria-label="Start time" style="display: flex; gap: 8px; margin-top: 10px"><sc-for list="{{times}}" as="d" hint-placeholder-count="3"><button role="radio" aria-checked="{{d.sel}}" onClick="{{d.pick}}" style="{{d.style}}">{{d.label}}</button></sc-for></div><div style="display: flex; align-items: center; justify-content: space-between; margin-top: 28px"><span style="font-size: 17px; font-weight: 600">Spots</span><span style="display: flex; align-items: center; gap: 4px"><button onClick="{{dec}}" aria-label="Fewer" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: #F5F5F7; font: inherit; font-size: 20px; color: #0A0A0A; cursor: pointer">−</button><span style="min-width: 48px; text-align: center; font-size: 19px; font-weight: 700">{{cap}}</span><button onClick="{{inc}}" aria-label="More" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: #F5F5F7; font: inherit; font-size: 20px; color: #0A0A0A; cursor: pointer">+</button></span></div><p aria-live="polite" style="margin: 26px 0 0; font-size: 15px; line-height: 1.5; color: #505054">{{note}}</p><div style="margin-top: auto"><a href="Published.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 16px; background: #0A0A0A; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none">Publish my table</a></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { d: 'Saturday', t: '17:30', cap: 8 };
  }
  renderVals() {
    const card = (on) => 'display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; border-radius: 18px; font: inherit; text-align: left; color: #0A0A0A; cursor: pointer; ' + (on ? 'border: 2px solid #0A0A0A; background: #FFFFFF' : 'border: 2px solid transparent; background: #F5F5F7');
    const chip = (on) => 'min-height: 48px; padding: 0 18px; border: 0; border-radius: 999px; font: inherit; font-size: 16px; cursor: pointer; ' + (on ? 'background: #0A0A0A; color: #FFFFFF; font-weight: 600' : 'background: #F5F5F7; color: #0A0A0A; font-weight: 500');
    const S = this.state;
    const days = ['Saturday', 'Sunday'].map((d) => ({ label: d, sel: S.d === d ? 'true' : 'false', pick: () => this.setState({ d }), style: chip(S.d === d) }));
    const times = ['13:00', '17:30', '19:00'].map((t) => ({ label: t, sel: S.t === t ? 'true' : 'false', pick: () => this.setState({ t }), style: chip(S.t === t) }));
    const live = S.d === 'Saturday';
    return { days, times, cap: S.cap,
      inc: () => this.setState({ cap: Math.min(30, S.cap + 1) }), dec: () => this.setState({ cap: Math.max(2, S.cap - 1) }),
      note: live ? 'Your guests can join Kemi’s live link-up at 19:00 from your table.' : 'The live link-up is on Saturday. Sunday tables get the recording of Kemi’s intro.' };
  }
}
</script>
</body>
</html>
