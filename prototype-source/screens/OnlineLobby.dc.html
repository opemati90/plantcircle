class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { got: [0, 1, 2] };
  }
  renderVals() {
    const n = 5, got = this.state.got, out = {};
    for (let i = 0; i < n; i++) {
      const on = got.includes(i);
      out['a' + i] = on ? 'true' : 'false';
      out['t' + i] = () => this.setState({ got: on ? got.filter((x) => x !== i) : got.concat(i) });

    }
    out.ready = got.length === n ? 'All set' : got.length + ' of ' + n + ' ready';
    return out;
  }
}
