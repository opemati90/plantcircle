<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PlantCircle — Manage guests</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
:focus-visible{outline:3px solid #0A0A0A;outline-offset:2px;box-shadow:0 0 0 6px #FFFFFF}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
a{color:#0A0A0A}a:hover{color:#000000}
.scrim{background:linear-gradient(180deg,rgba(0,0,0,0.35) 0%,rgba(0,0,0,0) 18%,rgba(0,0,0,0) 30%,rgba(0,0,0,0.9) 60%,rgba(0,0,0,0.94) 100%)}
.glass{background:rgba(20,20,20,0.42);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%)}
.bar{background:rgba(255,255,255,0.86);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; color: #0A0A0A; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased">
<div style="padding: 54px 24px 150px; display: flex; flex-direction: column; gap: 28px"><div style="display: flex; justify-content: space-between"><a href="Published.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: #F5F5F7; display: flex; align-items: center; justify-content: center; border: 0; cursor: pointer; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a><a href="ChatPlan.dc.html" aria-label="Message guests" style="width: 44px; height: 44px; border-radius: 999px; background: #F5F5F7; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg></a></div><div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 600; letter-spacing: 0.6px; color: #155A37">HAPPENING NOW</span><h1 style="margin: 0; font-size: 32px; font-weight: 700; line-height: 1.06; letter-spacing: -1px">{{here}} of 6 are here</h1><span style="font-size: 15px; color: #505054">Tap a name to check them in</span></div><div style="display: flex; flex-direction: column"><sc-for list="{{guests}}" as="g" hint-placeholder-count="6"><button onClick="{{g.toggle}}" style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0; border: 0; border-bottom: 1px solid #F0F0F2; background: transparent; font: inherit; text-align: left; cursor: pointer; color: #0A0A0A"><span style="{{g.av}}">{{g.initial}}</span><span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 17px; font-weight: 600">{{g.name}}</span><span style="font-size: 14px; color: #505054">{{g.sub}}</span></span><span style="{{g.ring}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span></button></sc-for></div></div><div class="bar" style="position: absolute; left: 14px; right: 14px; bottom: 22px; padding: 10px 10px 10px 20px; border-radius: 24px; border: 1px solid rgba(0,0,0,0.06); box-shadow: 0 10px 30px rgba(0,0,0,0.14); display: flex; align-items: center; justify-content: space-between; gap: 14px"><span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 600">2 on the waitlist</span><span style="font-size: 14px; color: #505054">Check-in closes at 22:30</span></span><a href="Leftovers.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 22px; border-radius: 16px; background: #0A0A0A; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none">End Plan</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { ins: [0, 1] };
  }
  renderVals() {
    const people = [
      ['M', 'Mia S.', 'Drinks', '#E8E3DA', '#5A4A33'], ['J', 'Jonas K.', 'Plantains', '#E3ECE2', '#1E4D33'],
      ['S', 'Sara', 'Joined from link', '#DCE6EE', '#2E4A60'], ['L', 'Lena', 'A side dish', '#EDE6F2', '#4A3560'],
      ['T', 'Tobias W.', 'Bread', '#F2EBDD', '#6A4E20'], ['K', 'Kemi A.', 'Dessert', '#E3ECE2', '#1E4D33']
    ];
    const ins = this.state.ins;
    const guests = people.map(([initial, name, sub, bg, fg], i) => {
      const on = ins.includes(i);
      return { initial, name, sub,
        av: 'width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; flex-shrink: 0; background: ' + bg + '; color: ' + fg,
        ring: 'width: 28px; height: 28px; border-radius: 999px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex-shrink: 0; ' + (on ? 'background: #155A37; border: 0' : 'background: transparent; border: 2px solid #767680'),
        toggle: () => this.setState({ ins: on ? ins.filter((x) => x !== i) : ins.concat(i) }) };
    });
    return { guests, here: ins.length };
  }
}
</script>
</body>
</html>
