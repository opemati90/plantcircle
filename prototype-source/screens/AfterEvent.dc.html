<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { r: 5, tags: ['Great host', 'Learned a lot'], m: false, j: false };
  }
  renderVals() {
    const S = this.state;
    const stars = [1, 2, 3, 4, 5].map((n) => ({ sel: S.r === n ? 'true' : 'false', label: n + (n === 1 ? ' star' : ' stars'), pick: () => this.setState({ r: n }),
      style: 'width: 48px; height: 48px; padding: 0; border: 0; background: transparent; cursor: pointer; color: ' + (n <= S.r ? '#B88400' : '#8A8A8E') }));
    const tags = ['Great host', 'Learned a lot', 'Friendly group', 'Tasty food'].map((label) => { const on = S.tags.includes(label); return { label, sel: on ? 'true' : 'false',
      pick: () => this.setState({ tags: on ? S.tags.filter((x) => x !== label) : S.tags.concat(label) }),
      style: 'min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; font: inherit; font-size: 15px; cursor: pointer; ' + (on ? 'background: #0A0A0A; color: #FFFFFF; font-weight: 600' : 'background: #F5F5F7; color: #0A0A0A; font-weight: 500') }; });
    const cb = (on) => 'min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #EAF5EE; color: #155A37' : 'background: #F5F5F7; color: #0A0A0A');
    return { stars, tags,
      c1: () => this.setState({ m: !S.m }), c1s: cb(S.m), c1l: S.m ? 'Requested' : 'Connect',
      c2: () => this.setState({ j: !S.j }), c2s: cb(S.j), c2l: S.j ? 'Requested' : 'Connect' };
  }
}
</script>
