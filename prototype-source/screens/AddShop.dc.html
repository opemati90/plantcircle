<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PlantCircle — Add a shop</title>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
:focus-visible{outline:3px solid #0A0A0A;outline-offset:2px;box-shadow:0 0 0 6px #FFFFFF}
a{color:#0A0A0A}a:hover{color:#000000}
.scrim{background:linear-gradient(180deg,rgba(0,0,0,0.35) 0%,rgba(0,0,0,0) 18%,rgba(0,0,0,0) 30%,rgba(0,0,0,0.9) 60%,rgba(0,0,0,0.94) 100%)}
.glass{background:rgba(255,255,255,0.22);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%)}
.bar{background:rgba(255,255,255,0.86);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; color: #0A0A0A; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased">
<div style="padding: 54px 24px 170px; display: flex; flex-direction: column; gap: 20px"><div style="display: flex"><a href="Explore.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 999px; background: #F5F5F7; display: flex; align-items: center; justify-content: center; border: 0; cursor: pointer; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a></div><div style="display: flex; flex-direction: column; gap: 8px"><h1 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -1px">Add a shop</h1><p style="margin: 0; font-size: 17px; line-height: 1.5; color: #505054">Help people near you find good food. The shop can claim this listing later.</p></div><label style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 15px; font-weight: 600">Name</span><input value="Afro-Caribbean Grocery" placeholder="" style="min-height: 52px; padding: 0 16px; border: 1.5px solid #E5E5EA; border-radius: 14px; font: inherit; font-size: 17px; color: #0A0A0A"></label><label style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 15px; font-weight: 600">Where</span><input value="" placeholder="Search an address" style="min-height: 52px; padding: 0 16px; border: 1.5px solid #E5E5EA; border-radius: 14px; font: inherit; font-size: 17px; color: #0A0A0A"></label><div style="display: flex; flex-direction: column; gap: 10px"><span style="font-size: 15px; font-weight: 600">What kind of shop?</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{kind}}" as="c" hint-placeholder-count="4"><button aria-pressed="{{c.sel}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button></sc-for></div></div><div style="display: flex; flex-direction: column; gap: 10px"><span style="font-size: 15px; font-weight: 600">Good for</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{good}}" as="c" hint-placeholder-count="4"><button aria-pressed="{{c.sel}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button></sc-for></div></div><button style="height: 110px; border: 1.5px dashed #8A8A8E; border-radius: 20px; background: #F5F5F7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: inherit; font-size: 15px; font-weight: 600; color: #0A0A0A; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><circle cx="12" cy="13" r="4"></circle></svg>Add a photo (optional)</button></div><div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(180deg, rgba(255,255,255,0) 0%, #FFFFFF 55%); pointer-events: none"></div><div class="bar" style="position: absolute; left: 14px; right: 14px; bottom: 22px; padding: 10px 10px 10px 20px; border-radius: 24px; border: 1px solid rgba(0,0,0,0.06); box-shadow: 0 10px 30px rgba(0,0,0,0.14); display: flex; align-items: center; justify-content: space-between; gap: 14px"><span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 600">Checked before it’s public</span><span style="font-size: 14px; color: #505054">Usually within a day</span></span><a href="Explore.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 20px; border-radius: 14px; font: inherit; font-size: 17px; font-weight: 600; letter-spacing: -0.2px; text-decoration: none; cursor: pointer; border: 0; background: #0A0A0A; color: #FFFFFF; min-height: 52px; min-width: 120px">Add shop</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { kind: 'Vegan-friendly', good: ['Hard-to-find ingredients'] };
  }
  renderVals() {
    const S = this.state;
    const st = (on) => 'min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; font: inherit; font-size: 15px; cursor: pointer; ' + (on ? 'background: #0A0A0A; color: #FFFFFF; font-weight: 600' : 'background: #F5F5F7; color: #0A0A0A; font-weight: 500');
    const kind = ['Fully vegan', 'Vegan-friendly', 'Farm shop', 'Online'].map((label) => ({ label, sel: S.kind === label ? 'true' : 'false', style: st(S.kind === label), pick: () => this.setState({ kind: label }) }));
    const good = ['Bulk orders', 'Hard-to-find ingredients', 'Zero-waste', 'Ships nationally'].map((label) => { const on = S.good.includes(label); return { label, sel: on ? 'true' : 'false', style: st(on), pick: () => this.setState({ good: on ? S.good.filter((x) => x !== label) : S.good.concat(label) }) }; });
    return { kind, good };
  }
}
</script>
</body>
</html>
