<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PlantCircle — Start a Plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
:focus-visible{outline:3px solid #0A0A0A;outline-offset:2px;box-shadow:0 0 0 6px #FFFFFF}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
a{color:#0A0A0A}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; color: #0A0A0A; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; padding: 54px 22px 40px; display: flex; flex-direction: column">
  <a href="Home.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 999px; background: #F5F5F7; display: flex; align-items: center; justify-content: center">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
  </a>

  <h1 style="margin: 30px 0 8px; font-size: 30px; font-weight: 700; line-height: 1.1; letter-spacing: -0.7px">What are you planning?</h1>
  <p style="margin: 0 0 24px; font-size: 16px; color: #505054">We’ll set up the details for you.</p>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{types}}" as="t" hint-placeholder-count="4">
      <button onClick="{{t.pick}}" style="{{t.style}}">
        <span style="position: relative; display: block; height: 112px; border-radius: 13px; overflow: hidden; background: #EDE6DA">
          <img src="{{t.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
          <span style="{{t.check}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span>
        </span>
        <span style="display: flex; flex-direction: column; gap: 2px; padding: 10px 4px 4px; text-align: left">
          <span style="font-size: 16px; font-weight: 600; letter-spacing: -0.3px">{{t.label}}</span>
          <span style="font-size: 13px; line-height: 1.5; color: #505054; font-weight: 400">{{t.hint}}</span>
        </span>
      </button>
    </sc-for>
  </div>

  <button style="margin-top: 16px; display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px; border: 0; border-radius: 14px; background: #F5F5F7; font: inherit; font-size: 15px; color: #0A0A0A; cursor: pointer"><span><span style="font-weight: 600">More types</span><span style="color: #505054"> · Meetup, food swap, volunteering</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#505054" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>

  <a href="{{nextHref}}" style="margin-top: auto; display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 14px; background: #0A0A0A; color: #FFFFFF; font-weight: 600; font-size: 17px; letter-spacing: -0.2px; text-decoration: none">Continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#155A37","options":["#155A37","#1F3F99","#8C3A0E","#0A0A0A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'Cooking night' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#155A37';
    const types = [
      { label: 'Cooking night', hint: 'Teach a dish, cook together', img: '/_blob/b9fb496816ae3a83b0f692223b0e24c9' },
      { label: 'Potluck', hint: 'Everyone brings something', img: '/_blob/8158e11caf9d4913049bf3946ebb5bbb' },
      { label: 'Group order', hint: 'Collect interest, pay offline', img: '/_blob/b999cc043f2f043fd5226cf1d032ce63' },
      { label: 'Online class', hint: 'Online or global edition', img: '/_blob/e126b3a48441e5d6a48d6a3852b44c7a' }
    ].map((t) => {
      const on = this.state.picked === t.label;
      return {
        label: t.label, hint: t.hint, img: t.img,
        style: 'padding: 4px; border-radius: 17px; background: #FFFFFF; font: inherit; color: #0A0A0A; cursor: pointer; text-align: left; ' +
          (on ? 'border: 2px solid #0A0A0A' : 'border: 2px solid transparent'),
        check: 'position: absolute; right: 8px; top: 8px; width: 22px; height: 22px; border-radius: 999px; align-items: center; justify-content: center; background: ' + accent + '; display: ' + (on ? 'flex' : 'none'),
        pick: () => this.setState({ picked: t.label })
      };
    });
    return { accent, types, nextHref: this.state.picked === 'Group order' ? 'CreateOrder.dc.html' : this.state.picked === 'Online class' ? 'GlobalCreate.dc.html' : 'AIDraft.dc.html' };
  }
}
</script>
</body>
</html>
