.bar{background:rgba(255,255,255,0.86);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; color: #0A0A0A; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased">
<div style="padding: 54px 24px 190px; display: flex; flex-direction: column; gap: 26px"><div style="display: flex"><a href="ManageGuests.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: #F5F5F7; display: flex; align-items: center; justify-content: center; border: 0; cursor: pointer; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a></div><div style="display: flex; flex-direction: column; gap: 14px; "><span aria-hidden="true" style="width: 80px; height: 80px; border-radius: 999px; background: #EAF5EE; display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#155A37" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path></svg></span><h1 style="margin: 0; font-size: 30px; font-weight: 700; line-height: 1.1; letter-spacing: -0.9px">Any food left over?</h1><p style="margin: 0; font-size: 17px; line-height: 1.5; color: #505054">So nothing good ends up in the bin.</p></div><div role="radiogroup" style="display: flex; flex-direction: column; gap: 10px"><button role="radio" aria-checked="{{c_home}}" onClick="{{p_home}}" style="{{s_home}}"><span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 16px; flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #F5F5F7"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.2 12 3l9 7.2V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="font-size: 17px; font-weight: 600">Guests took it home</span><span style="font-size: 14px; color: #505054">Counted as saved</span></span></button><button role="radio" aria-checked="{{c_share}}" onClick="{{p_share}}" style="{{s_share}}"><span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 16px; flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #F5F5F7"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="font-size: 17px; font-weight: 600">Share it nearby</span><span style="font-size: 14px; color: #505054">Post it for a food-sharing pick-up</span></span></button><button role="radio" aria-checked="{{c_none}}" onClick="{{p_none}}" style="{{s_none}}"><span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 16px; flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #F5F5F7"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="font-size: 17px; font-weight: 600">Nothing left</span><span style="font-size: 14px; color: #505054">Great planning</span></span></button></div><div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 17px; font-weight: 600">Roughly how much?</span><span style="display: flex; align-items: center; gap: 4px; padding: 3px; border-radius: 999px; background: #F5F5F7"><button onClick="{{dec}}" aria-label="Less" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: transparent; font: inherit; font-size: 20px; color: #0A0A0A; cursor: pointer">−</button><span style="min-width: 60px; text-align: center; font-size: 17px; font-weight: 700">{{kg}} kg</span><button onClick="{{inc}}" aria-label="More" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: #FFFFFF; font: inherit; font-size: 20px; color: #0A0A0A; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.1)">+</button></span></div></div><div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(180deg, rgba(255,255,255,0) 0%, #FFFFFF 55%); pointer-events: none"></div><div class="bar" style="position: absolute; left: 14px; right: 14px; bottom: 22px; padding: 12px; border-radius: 24px; border: 1px solid rgba(0,0,0,0.06); box-shadow: 0 10px 30px rgba(0,0,0,0.14); display: flex; flex-direction: column; gap: 6px"><a href="AIRecap.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 20px; border: 0; border-radius: 16px; background: #0A0A0A; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 600; text-decoration: none; cursor: pointer">Continue</a><a href="AIRecap.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; border: 0; background: transparent; color: #505054; font: inherit; font-size: 15px; font-weight: 500; text-decoration: none; cursor: pointer">Skip</a></div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { v: 'share', kg: 1.5 };
  }
  renderVals() {
    const out = { kg: this.state.kg.toString().replace('.', ','),
      inc: () => this.setState({ kg: Math.min(20, +(this.state.kg + 0.5).toFixed(1)) }), dec: () => this.setState({ kg: Math.max(0, +(this.state.kg - 0.5).toFixed(1)) }) };
    ['home', 'share', 'none'].forEach((k) => { const on = this.state.v === k; out['p_' + k] = () => this.setState({ v: k }); out['c_' + k] = on ? 'true' : 'false';
      out['s_' + k] = 'display: flex; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 18px; font: inherit; color: #0A0A0A; cursor: pointer; background: #FFFFFF; ' + (on ? 'border: 2px solid #0A0A0A' : 'border: 2px solid #EDEDED'); });
    return out;
  }
}
</script>
