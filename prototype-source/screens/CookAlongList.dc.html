<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { got: [0, 5] };
  }
  renderVals() {
    const n = 7, got = this.state.got, out = {};
    for (let i = 0; i < n; i++) {
      const on = got.includes(i);
      out['a' + i] = on ? 'true' : 'false';
      out['t' + i] = () => this.setState({ got: on ? got.filter((x) => x !== i) : got.concat(i) });
      out['b' + i] = 'width: 26px; height: 26px; border-radius: 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; ' + (on ? 'background: #155A37; border: 0' : 'background: #FFFFFF; border: 2px solid #767680');
      out['n' + i] = 'font-size: 17px; font-weight: 500; ' + (on ? 'color: #505054; text-decoration: line-through' : 'color: #0A0A0A');
    }
    const left = n - got.length;
    out.left = left === 0 ? 'All set — see you at the table.' : left + ' of ' + n + ' still to buy';
    return out;
  }
}
