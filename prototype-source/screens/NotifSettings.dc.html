class Component extends DCLogic {
  constructor(props) {

  renderVals() {
    const out = {};

      out['tr_' + k] = 'position: relative; width: 51px; height: 31px; border-radius: 999px; flex-shrink: 0; display: block; background: ' + (on ? '#155A37' : '#767680');

    return out;
  }
}
