<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { bal: 420, got: [] };
  }
  renderVals() {
    const S = this.state, cost = { pro: 300, fee: 150, perk: 100 }, out = { bal: String(S.bal) };
    ['pro', 'fee', 'perk'].forEach((k) => { const got = S.got.includes(k), can = S.bal >= cost[k];
      out['r_' + k] = () => { if (!got && can) this.setState({ bal: S.bal - cost[k], got: S.got.concat(k) }); };
      out['rl_' + k] = got ? 'Redeemed' : String(cost[k]);
      out['rs_' + k] = 'display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 18px; font: inherit; color: #0A0A0A; cursor: pointer; background: #FFFFFF; ' + (got ? 'border: 2px solid #155A37' : 'border: 1px solid #EDEDED') + (can || got ? '' : '; opacity: 0.55'); });
    return out;
  }
}
</script>
