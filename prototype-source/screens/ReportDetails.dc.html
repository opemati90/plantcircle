<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PlantCircle — Report details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
:focus-visible{outline:3px solid #0A0A0A;outline-offset:2px;box-shadow:0 0 0 6px #FFFFFF}
a{color:#0A0A0A}a:hover{color:#000000}
.scrim{background:linear-gradient(180deg,rgba(0,0,0,0.35) 0%,rgba(0,0,0,0) 18%,rgba(0,0,0,0) 30%,rgba(0,0,0,0.9) 60%,rgba(0,0,0,0.94) 100%)}
.glass{background:rgba(255,255,255,0.22);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%)}
.bar{background:rgba(255,255,255,0.86);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; color: #0A0A0A; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased">
<div style="padding: 54px 24px 190px; display: flex; flex-direction: column; gap: 26px"><div style="display: flex"><a href="ReportSheet.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: #F5F5F7; display: flex; align-items: center; justify-content: center; border: 0; cursor: pointer; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a></div><div style="display: flex; flex-direction: column; gap: 14px; "><span aria-hidden="true" style="width: 80px; height: 80px; border-radius: 999px; background: #FDECEA; display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#8C1D12" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22V4M4 4h12l-2 4 2 4H4"></path></svg></span><h1 style="margin: 0; font-size: 30px; font-weight: 700; line-height: 1.1; letter-spacing: -0.9px">Tell us what happened</h1><p style="margin: 0; font-size: 17px; line-height: 1.5; color: #505054">Be as specific as you can. The person won’t see who reported them.</p></div><label style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 16px; font-weight: 600">What’s wrong with this group order?</span><textarea rows="4" style="padding: 14px 16px; border: 1.5px solid #E5E5EA; border-radius: 16px; font: inherit; font-size: 17px; line-height: 1.5; color: #0A0A0A; resize: none">The organiser asked everyone to pay in advance to a personal account, then deleted the chat.</textarea></label><button style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 14px; border: 1.5px dashed #8A8A8E; border-radius: 16px; background: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; color: #0A0A0A; cursor: pointer"><span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 16px; flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #F5F5F7"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><circle cx="12" cy="13" r="4"></circle></svg></span>Add screenshots</button><button onClick="{{tog}}" role="checkbox" aria-checked="{{ac}}" style="display: flex; align-items: flex-start; gap: 14px; padding: 0; border: 0; background: transparent; font: inherit; text-align: left; color: #3A3A3C; cursor: pointer"><span style="{{box}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span><span style="font-size: 16px; line-height: 1.5">I believe this report is accurate and complete.</span></button></div><div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(180deg, rgba(255,255,255,0) 0%, #FFFFFF 55%); pointer-events: none"></div><div class="bar" style="position: absolute; left: 14px; right: 14px; bottom: 22px; padding: 12px; border-radius: 24px; border: 1px solid rgba(0,0,0,0.06); box-shadow: 0 10px 30px rgba(0,0,0,0.14)"><sc-if value="{{ok}}" hint-placeholder-val="{{ true }}"><a href="ReportDone.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 16px; background: #0A0A0A; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none">Send report</a></sc-if><sc-if value="{{notOk}}" hint-placeholder-val="{{ false }}"><button disabled style="width: 100%; min-height: 54px; border: 0; border-radius: 16px; background: #E5E5EA; font: inherit; font-size: 17px; font-weight: 600; color: #505054">Confirm above to send</button></sc-if></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { c: true };
  }
  renderVals() {
    const c = this.state.c;
    return { tog: () => this.setState({ c: !c }), ac: c ? 'true' : 'false', ok: c, notOk: !c,
      box: 'width: 26px; height: 26px; border-radius: 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex-shrink: 0; ' + (c ? 'background: #155A37; border: 0' : 'background: #FFFFFF; border: 2px solid #767680') };
  }
}
</script>
</body>
</html>
