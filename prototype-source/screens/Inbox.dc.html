<helmet>
<style>
body{margin:0}
:focus-visible{outline:3px solid #0A0A0A;outline-offset:2px;box-shadow:0 0 0 6px #FFFFFF}
a{color:#0A0A0A}a:hover{color:#000000}

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; color: #0A0A0A; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased">
<div style="padding: 58px 20px 120px; display: flex; flex-direction: column; gap: 16px"><div style="display: flex; align-items: center; justify-content: space-between; gap: 12px"><h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -1.1px">Inbox</h1></div><div role="tablist" style="display: flex; gap: 8px"><sc-for list="{{filters}}" as="f" hint-placeholder-count="4"><button role="tab" aria-selected="{{f.sel}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button></sc-for></div><a href="MessageRequest.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 20px; background: #F5F5F7; text-decoration: none; color: #0A0A0A"><span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21v-1a6 6 0 0 1 10-4.5M16 11h6M19 8v6"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">1 message request</span><span style="font-size: 14px; color: #505054">Only people you accept can message you</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8A8E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a><div style="display: flex; flex-direction: column"><sc-for list="{{threads}}" as="t" hint-placeholder-count="4"><a href="{{t.href}}" style="display: flex; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid #EDEDED; text-decoration: none; color: #0A0A0A"><sc-if value="{{t.hasImg}}" hint-placeholder-val="{{ true }}"><img src="{{t.img}}" alt="" style="width: 56px; height: 56px; border-radius: 16px; object-fit: cover; flex-shrink: 0"></sc-if><sc-if value="{{t.isPerson}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 999px; background: #E3ECE2; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: #1E4D33; flex-shrink: 0">{{t.initial}}</span></sc-if><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 17px; font-weight: 600; letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.title}}</span><span style="font-size: 14px; color: #505054; flex-shrink: 0">{{t.time}}</span></span><span style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><span style="{{t.previewStyle}}">{{t.preview}}</span><span style="{{t.dot}}"></span></span><span style="font-size: 13px; color: #505054">{{t.kind}}</span></span></a></sc-for></div></div><nav aria-label="Main" style="position: absolute; left: 12px; right: 12px; bottom: 20px; height: 72px; box-sizing: border-box; padding: 8px 4px; border-radius: 28px; background: rgba(255,255,255,0.9); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(0,0,0,0.08); box-shadow: 0 10px 30px rgba(0,0,0,0.12); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); z-index: 5">
    <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 0; text-decoration: none; color: #505054"><span style="color: #505054; width: 52px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.2 12 3l9 7.2V20a2 2 0 0 1-2 2h-4v-7H9v7H5a2 2 0 0 1-2-2z"></path></svg></span><span style="font-size: 11px; font-weight: 500; line-height: 1.2; white-space: nowrap">Home</span></a>
    <a href="Explore.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 0; text-decoration: none; color: #505054"><span style="color: #505054; width: 52px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m15.5 8.5-2 5-5 2 2-5z"></path></svg></span><span style="font-size: 11px; font-weight: 500; line-height: 1.2; white-space: nowrap">Explore</span></a>
    <a href="MyPlans.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 0; text-decoration: none; color: #505054"><span style="color: #505054; width: 52px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg></span><span style="font-size: 11px; font-weight: 500; line-height: 1.2; white-space: nowrap">My Plans</span></a>
    <a href="Inbox.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 0; text-decoration: none; color: #0A0A0A"><span style="background: #0A0A0A; color: #FFFFFF; width: 52px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.2A8.5 8.5 0 1 1 21 12z"></path></svg></span><span style="font-size: 11px; font-weight: 600; line-height: 1.2; white-space: nowrap">Inbox</span></a>

  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'All' };
  }
  renderVals() {
    const all = [
      { kind: 'Plan chat', cat: 'Plans', title: 'Sunday Community Potluck', preview: 'Jonas: I’ll bring a big table — chairs, anyone?', time: '18:42', unread: true, img: '/_blob/8158e11caf9d4913049bf3946ebb5bbb', href: 'ChatPlan.dc.html' },
      { kind: 'Group order', cat: 'Plans', title: 'Bulk grocery order', preview: 'Jonas: 68 kg so far — 32 to go before Thursday', time: '16:10', unread: true, img: '/_blob/b999cc043f2f043fd5226cf1d032ce63', href: 'ChatPlan.dc.html' },
      { kind: 'Direct message', cat: 'Direct', title: 'Ama O.', preview: 'You: Thanks! Can’t wait for Saturday', time: 'Yesterday', unread: false, initial: 'A', href: 'ChatDM.dc.html' },
      { kind: 'Circle', cat: 'Circles', title: 'Neukölln Plant Kitchen', preview: 'Mia: Anyone know where to get fresh okra?', time: 'Mon', unread: false, img: '/_blob/e126b3a48441e5d6a48d6a3852b44c7a', href: 'Circle.dc.html' }
    ];
    const f = this.state.filter;
    const threads = all.filter((t) => f === 'All' || t.cat === f).map((t) => ({ ...t, hasImg: !!t.img, isPerson: !t.img,
      previewStyle: 'font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; ' + (t.unread ? 'color: #0A0A0A; font-weight: 500' : 'color: #505054'),
      dot: 'width: 10px; height: 10px; border-radius: 999px; flex-shrink: 0; background: ' + (t.unread ? '#155A37' : 'transparent') }));
    const filters = ['All', 'Plans', 'Circles', 'Direct'].map((label) => ({ label, sel: f === label ? 'true' : 'false', pick: () => this.setState({ filter: label }),
      style: 'min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; font: inherit; font-size: 15px; cursor: pointer; ' + (f === label ? 'background: #0A0A0A; color: #FFFFFF; font-weight: 600' : 'background: #F5F5F7; color: #0A0A0A; font-weight: 500') }));
    return { filters, threads };
  }
}
</script>
