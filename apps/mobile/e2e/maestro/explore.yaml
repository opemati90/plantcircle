# The Circles tab on a simulator (F3): Circles first, then a city's Plans: search, filter by
# where, clear. Learn and People are hidden at launch (src/lib/features.ts).
# Fixture backend; Metro on :8081.
#   maestro test apps/mobile/e2e/maestro/explore.yaml
appId: app.plantcircle.mobile
---
- launchApp:
    clearState: true
- tapOn: 'Get started'
- tapOn: 'Continue'
- tapOn: 'Type your city'
- inputText: 'berli'
- tapOn:
    id: 'city-berlin'
- scrollUntilVisible:
    element: 'Continue'
    direction: DOWN
- tapOn: 'Continue'
- assertVisible: 'This week in Berlin'
- tapOn: 'Circles'
- assertVisible: '.*Neukölln Plant Kitchen.*'
- tapOn: 'Plans'
- assertVisible: '.*West African Cooking Night.*'
- tapOn: 'Search'
- inputText: 'potluck'
- assertVisible: '.*Sunday Community Potluck.*'
- assertNotVisible: '.*West African Cooking Night.*'
- eraseText: 20
- pressKey: Enter
- assertVisible: '.*West African Cooking Night.*'
- tapOn:
    id: 'explore-filters'
- assertVisible: 'When'
- tapOn: 'Online'
- tapOn: 'Show results.*'
- assertVisible: '.*Vegan Feijoada.*'
- assertVisible: 'Remove filter Online'
- tapOn: 'Remove filter Online'
- assertVisible: '.*West African Cooking Night.*'
- assertNotVisible: 'Learn'
- assertNotVisible: 'People'
